name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      ACTIVE_SUPPORT_VERSION: '~> 8.1.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.11'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rake lint
      - run: gem build axinite.gemspec
  integration:
    runs-on: ubuntu-22.04
    env:
      BUNDLE_GEMFILE: integration/Gemfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.11'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rspec spec integration/active_force_spec.rb
  acceptance:
    runs-on: ubuntu-22.04
    env:
      BUNDLE_GEMFILE: acceptance/Gemfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.11'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rake acceptance
